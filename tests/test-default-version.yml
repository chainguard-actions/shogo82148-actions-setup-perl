name: Test Perl setup with default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          enable-modules-cache: false
      - name: Assert perl-version output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "actual perl-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is set to $ACTUAL"
      - name: Assert perl is in PATH
        run: |
          which perl
          if [ $? -ne 0 ]; then
            echo "FAIL: perl not found in PATH"
            exit 1
          fi
          echo "PASS: perl found at $(which perl)"
      - name: Assert perl runs successfully
        run: |
          OUTPUT=$(perl -e 'print "hello from perl\n"')
          echo "perl output: $OUTPUT"
          if [ "$OUTPUT" != "hello from perl" ]; then
            echo "FAIL: unexpected perl output: $OUTPUT"
            exit 1
          fi
          echo "PASS: perl runs successfully"
      - name: Assert perl-hash output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-hash }}
        run: |
          echo "actual perl-hash: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-hash output is empty"
            exit 1
          fi
          echo "PASS: perl-hash output is set"
