name: Test install-modules-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          install-modules-args: "--notest --quiet"
          install-modules: |
            Try::Tiny
          enable-modules-cache: false
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version is '$PERL_VERSION'"
      - name: Assert perl is on PATH
        run: |
          if ! command -v perl >/dev/null 2>&1; then
            echo "FAIL: perl not found on PATH"
            exit 1
          fi
          echo "PASS: perl found at $(command -v perl)"
      - name: Assert Try::Tiny is installed
        run: |
          if ! perl -MTry::Tiny -e 'print "Try::Tiny loaded\n"'; then
            echo "FAIL: Try::Tiny not installed"
            exit 1
          fi
          echo "PASS: Try::Tiny is installed"
