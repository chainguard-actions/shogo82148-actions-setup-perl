name: Test installing CPAN modules with extra installer args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          install-modules-args: --quiet --no-man-pages
          install-modules: |
            Try::Tiny
          enable-modules-cache: "false"
      - name: Assert perl-version output set
        env:
          ACTUAL: ${{ steps.action.outputs.perl-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            5.38.*) echo "PASS" ;;
            *) echo "FAIL: expected 5.38.x"; exit 1 ;;
          esac
      - name: Assert module installed with extra args
        run: |
          perl -MTry::Tiny -e 'print "Try::Tiny $Try::Tiny::VERSION\n"' || { echo "FAIL: Try::Tiny not loadable"; exit 1; }
          if [ ! -d "$GITHUB_WORKSPACE/local" ]; then
            echo "FAIL: local/ directory not created by cpanm"
            exit 1
          fi
          echo "PASS"
