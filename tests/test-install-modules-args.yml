name: Test install-modules-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          install-modules-args: "--notest"
          install-modules: |
            Try::Tiny
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version is set to $PERL_VERSION"
      - name: Assert perl is on PATH
        run: |
          which perl
          perl --version
          echo "PASS: perl is available on PATH"
      - name: Assert Try::Tiny is installed
        run: |
          if perl -MTry::Tiny -e 'print "Try::Tiny loaded\n"'; then
            echo "PASS: Try::Tiny is installed"
          else
            echo "FAIL: Try::Tiny is not installed"
            exit 1
          fi
