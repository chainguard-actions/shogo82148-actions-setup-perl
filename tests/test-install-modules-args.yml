name: Test install-modules-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create cpanfile
        run: |
          cat > "$GITHUB_WORKSPACE/cpanfile" <<'EOF'
          requires 'Try::Tiny';
          EOF

      - id: action
        uses: .
        with:
          perl-version: "5.38.2"
          install-modules-with: cpanm
          install-modules-args: "--notest"
          enable-modules-cache: false

      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.action.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version is set to $PERL_VERSION"

      - name: Assert Try::Tiny is installed
        run: |
          if perl -e 'use Try::Tiny; print "ok\n"'; then
            echo "PASS: Try::Tiny is installed"
          else
            echo "FAIL: Try::Tiny is not installed"
            exit 1
          fi
