name: Test install CPAN modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          install-modules: |
            JSON
            Try::Tiny
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert JSON module is installed
        run: |
          perl -MJSON -e 'print "JSON version: ", $JSON::VERSION, "\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: JSON module not installed"
            exit 1
          fi
          echo "PASS: JSON module is installed"
      - name: Assert Try::Tiny module is installed
        run: |
          perl -MTry::Tiny -e 'print "Try::Tiny version: ", $Try::Tiny::VERSION, "\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: Try::Tiny module not installed"
            exit 1
          fi
          echo "PASS: Try::Tiny module is installed"
