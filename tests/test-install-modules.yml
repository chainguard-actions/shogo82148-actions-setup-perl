name: Test installing CPAN modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          install-modules: |
            Try::Tiny
            Scalar::Util
      - name: Assert perl is on PATH
        run: |
          which perl
          perl --version
          echo "PASS: perl is on PATH"
      - name: Assert Try::Tiny is installed
        run: |
          perl -e 'use Try::Tiny; print "PASS: Try::Tiny loaded\n"'
      - name: Assert Scalar::Util is installed
        run: |
          perl -e 'use Scalar::Util; print "PASS: Scalar::Util loaded\n"'
