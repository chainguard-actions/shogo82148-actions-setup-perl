name: Test installing CPAN modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          install-modules-with: cpanm
          install-modules: |
            JSON
          enable-modules-cache: false

      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert JSON module is installed
        run: |
          perl -e 'use JSON; print "JSON version: ", JSON->VERSION, "\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: JSON module not available"
            exit 1
          fi
          echo "PASS: JSON module is installed"

      - name: Assert cpanm is available
        run: |
          which cpanm
          cpanm --version
          echo "PASS: cpanm is available"
