name: Test install-modules inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          install-modules-with: "cpanm"
          install-modules-args: "--notest"
          install-modules: |
            Try::Tiny
      - name: Assert perl-version output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "actual perl-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Try::Tiny is installed
        run: |
          perl -MTry::Tiny -e 'print "Try::Tiny loaded successfully\n"'
          echo "PASS: Try::Tiny is installed"
