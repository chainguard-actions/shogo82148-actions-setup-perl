name: Test installing CPAN modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          install-modules-with: cpanm
          install-modules: |
            Try::Tiny
            JSON::PP

      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is '$PERL_VERSION'"

      - name: Assert Try::Tiny is installed
        run: |
          perl -e 'use Try::Tiny; print "Try::Tiny loaded OK\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: Try::Tiny not installed"
            exit 1
          fi
          echo "PASS: Try::Tiny is installed"

      - name: Assert JSON::PP is installed
        run: |
          perl -e 'use JSON::PP; print "JSON::PP loaded OK\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: JSON::PP not installed"
            exit 1
          fi
          echo "PASS: JSON::PP is installed"
