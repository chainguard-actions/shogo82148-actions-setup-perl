name: Test installing CPAN modules with cpanm
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          install-modules: |
            Try::Tiny
          enable-modules-cache: "false"
      - name: Assert module installed
        run: |
          perl -MTry::Tiny -e 'print "Try::Tiny $Try::Tiny::VERSION\n"' || { echo "FAIL: Try::Tiny not loadable"; exit 1; }
          echo "PASS"
      - name: Assert cache-hit is not true
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" = "true" ]; then echo "FAIL: cache disabled but hit reported"; exit 1; fi
          echo "PASS"
