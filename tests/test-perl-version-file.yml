name: Test Perl setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .perl-version file
        run: |
          echo "5.36.0" > "$GITHUB_WORKSPACE/.perl-version"
          cat "$GITHUB_WORKSPACE/.perl-version"

      - id: setup-perl
        uses: .
        with:
          perl-version-file: ".perl-version"

      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is '$PERL_VERSION'"

      - name: Assert perl is available
        run: |
          which perl
          ACTUAL=$(perl -e 'print $^V')
          echo "perl version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl not found or version empty"
            exit 1
          fi
          echo "PASS: perl is available at version $ACTUAL"

      - name: Assert perl-hash output is set
        env:
          PERL_HASH: ${{ steps.setup-perl.outputs.perl-hash }}
        run: |
          echo "perl-hash: $PERL_HASH"
          if [ -z "$PERL_HASH" ]; then
            echo "FAIL: perl-hash output is empty"
            exit 1
          fi
          echo "PASS: perl-hash output is set"
