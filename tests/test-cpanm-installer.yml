name: Test Perl setup with cpanm installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create cpanfile
        run: |
          cat > cpanfile << 'EOF'
          requires 'Try::Tiny';
          EOF
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.2"
          install-modules-with: cpanm
          enable-modules-cache: false
      - name: Assert perl-version output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "actual perl-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is set to $ACTUAL"
      - name: Assert cpanm is available
        run: |
          which cpanm
          if [ $? -ne 0 ]; then
            echo "FAIL: cpanm not found in PATH"
            exit 1
          fi
          echo "PASS: cpanm found at $(which cpanm)"
      - name: Assert Try::Tiny is installed from cpanfile
        run: |
          perl -e 'use Try::Tiny; print "Try::Tiny loaded OK\n"'
          if [ $? -ne 0 ]; then
            echo "FAIL: Try::Tiny not installed via cpanm from cpanfile"
            exit 1
          fi
          echo "PASS: Try::Tiny is installed"
