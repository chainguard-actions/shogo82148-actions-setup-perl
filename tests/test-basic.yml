name: Test basic Perl setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version=$PERL_VERSION"
      - name: Assert perl-hash output is set
        env:
          PERL_HASH: ${{ steps.setup-perl.outputs.perl-hash }}
        run: |
          echo "perl-hash: $PERL_HASH"
          if [ -z "$PERL_HASH" ]; then
            echo "FAIL: perl-hash output is empty"
            exit 1
          fi
          echo "PASS: perl-hash is set"
      - name: Assert perl is on PATH and correct version
        run: |
          which perl
          perl --version
          ACTUAL_VERSION=$(perl -e 'print $^V')
          echo "actual perl version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "5.38"; then
            echo "FAIL: expected perl 5.38.x but got $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: perl version matches"
