name: Test multi-thread Perl setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          multi-thread: "true"

      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is '$PERL_VERSION'"

      - name: Assert perl is available
        run: |
          which perl
          ACTUAL=$(perl -e 'print $^V')
          echo "perl version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl not found or version empty"
            exit 1
          fi
          echo "PASS: perl is available at version $ACTUAL"

      - name: Assert multi-threading is enabled
        run: |
          THREADS=$(perl -e 'use Config; print $Config{usethreads}')
          echo "usethreads: $THREADS"
          if [ "$THREADS" != "define" ]; then
            echo "FAIL: expected multi-threading to be enabled (usethreads=define), got '$THREADS'"
            exit 1
          fi
          echo "PASS: multi-threading is enabled"
