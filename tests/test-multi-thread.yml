name: Test multi-thread Perl setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          multi-thread: "true"
      - name: Assert perl is on PATH
        run: |
          which perl
          perl --version
          echo "PASS: perl is on PATH"
      - name: Assert perl-version output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "actual perl-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is set to $ACTUAL"
      - name: Assert threading is enabled
        run: |
          THREADS=$(perl -e 'use Config; print $Config{usethreads}')
          echo "usethreads: $THREADS"
          if [ "$THREADS" != "define" ]; then
            echo "FAIL: expected threading to be enabled (define) but got: $THREADS"
            exit 1
          fi
          echo "PASS: threading is enabled"
