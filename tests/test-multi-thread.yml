name: Test Perl setup with multi-threading enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-perl
        uses: .
        with:
          perl-version: "5.38.0"
          multi-thread: "true"
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version is set to $PERL_VERSION"
      - name: Assert perl is on PATH
        run: |
          which perl
          perl --version
      - name: Assert multi-threading is enabled (useithreads)
        run: |
          ITHREADS=$(perl -MConfig -e 'print $Config{useithreads}')
          echo "useithreads: $ITHREADS"
          if [ "$ITHREADS" = "define" ]; then
            echo "PASS: multi-threading (useithreads) is enabled"
          else
            echo "FAIL: expected useithreads=define, got $ITHREADS"
            exit 1
          fi
