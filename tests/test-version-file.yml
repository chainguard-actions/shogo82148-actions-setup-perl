name: Test Perl setup with version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .perl-version file
        run: |
          echo "5.36.3" > .perl-version
          cat .perl-version
      - id: setup-perl
        uses: .
        with:
          perl-version-file: ".perl-version"
      - name: Assert perl-version output is set
        env:
          ACTUAL: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "actual perl-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version output is set to $ACTUAL"
      - name: Assert perl is in PATH
        run: |
          which perl
          perl --version
          echo "PASS: perl is available in PATH"
      - name: Assert perl version matches version file
        run: |
          PERL_VER=$(perl -e 'print $^V')
          echo "Perl version: $PERL_VER"
          if [[ "$PERL_VER" != *"5.36.3"* ]]; then
            echo "FAIL: expected perl 5.36.3, got $PERL_VER"
            exit 1
          fi
          echo "PASS: perl version matches version file"
