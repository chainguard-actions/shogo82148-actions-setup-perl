name: Test Perl setup with version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .perl-version file
        run: |
          echo "5.36.0" > .perl-version
          cat .perl-version
      - id: setup-perl
        uses: .
        with:
          perl-version-file: ".perl-version"
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version=$PERL_VERSION"
      - name: Assert perl is on PATH and correct version
        run: |
          which perl
          perl --version
          ACTUAL_VERSION=$(perl -e 'print $^V')
          echo "actual perl version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "5.36"; then
            echo "FAIL: expected perl 5.36.x but got $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: perl version matches"
