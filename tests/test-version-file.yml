name: Test Perl setup using perl-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .perl-version file
        run: |
          echo "5.38.0" > .perl-version
          cat .perl-version
      - id: setup-perl
        uses: .
        with:
          perl-version-file: ".perl-version"
      - name: Assert perl-version output is set
        env:
          PERL_VERSION: ${{ steps.setup-perl.outputs.perl-version }}
        run: |
          echo "perl-version: $PERL_VERSION"
          if [ -z "$PERL_VERSION" ]; then
            echo "FAIL: perl-version output is empty"
            exit 1
          fi
          echo "PASS: perl-version is set to $PERL_VERSION"
      - name: Assert perl-hash output is set
        env:
          PERL_HASH: ${{ steps.setup-perl.outputs.perl-hash }}
        run: |
          echo "perl-hash: $PERL_HASH"
          if [ -z "$PERL_HASH" ]; then
            echo "FAIL: perl-hash output is empty"
            exit 1
          fi
          echo "PASS: perl-hash is set"
      - name: Assert cache-hit output is set (true or false)
        env:
          CACHE_HIT: ${{ steps.setup-perl.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ]; then
            echo "PASS: cache-hit is a valid boolean value"
          else
            echo "INFO: cache-hit value is '$CACHE_HIT' (may be empty if caching not applicable)"
            echo "PASS"
          fi
      - name: Assert perl is on PATH
        run: |
          which perl
          perl --version
          ACTUAL=$(perl -e 'printf "%vd", $^V')
          echo "actual perl version: $ACTUAL"
          if echo "$ACTUAL" | grep -q "^5\.38"; then
            echo "PASS: perl version is 5.38.x"
          else
            echo "FAIL: expected 5.38.x, got $ACTUAL"
            exit 1
          fi
