name: Test invalid version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          perl-version: "4.0.0"
          enable-modules-cache: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.perl-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "perl-version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unavailable perl version"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            echo "FAIL: perl-version output should be empty"
            exit 1
          fi
          echo "PASS"
